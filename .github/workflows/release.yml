# Release: build the CLI for every platform this package claims, publish one tarball
# per platform plus one SHA256SUMS covering all of them.
#
# Deliberately not the release an app ships: that kind signs and notarizes a DMG of
# a GUI app from a self-hosted runner holding a Developer ID. This package is a
# command-line binary with no bundle, no app and no secrets, so it runs entirely on
# GitHub-hosted runners and signs nothing. What that costs the user is stated in
# RELEASING.md rather than hidden: an unsigned macOS binary is fine when fetched with
# curl (no quarantine attribute) and is blocked by Gatekeeper when fetched with a
# browser, which is the whole reason the install script exists.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE macOS asset, built universal on the arm64 runner rather than two assets
          # from two runners: GitHub's Intel macOS images are on their way out, and
          # `swift build --arch arm64 --arch x86_64` produces a Mach-O carrying both —
          # verified locally: `Mach-O universal binary with 2 architectures`.
          - name: macos-universal
            runner: macos-15
            asset: alohajet-macos-universal
            build_flags: "--arch arm64 --arch x86_64"
          - name: linux-x86_64
            runner: ubuntu-24.04
            container: swift:6.2.3-noble
            asset: alohajet-linux-x86_64
            build_flags: ""
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select a toolchain that can build this package
        # macOS only: the Linux leg runs in swift:6.2.3-noble, which is already right.
        # Without this the v0.1.0 release run died here with
        # "package is using Swift tools version 6.2.0 but the installed version is
        # 6.1.0" — an older toolchain does not warn, it fails to parse the manifest.
        # Same step, same assertion as ci.yml; the two must not drift.
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # Newest-first, skipping toolchains known to miscompile this package. Swift
          # 6.2.4 (Xcode 26.3) CRASHES the frontend on `swift build -c release
          # --arch arm64 --arch x86_64` over the BrowserTools module — "Please submit a
          # bug report", stack dump, no diagnostic. The same command on 6.2.3 builds
          # clean, so this is the compiler, not the code, and there is nothing to fix
          # on our side but the choice of compiler.
          # Drop an entry from BAD when its fix ships; keep the list, because "take the
          # newest" is otherwise one image bump away from an unexplained red release.
          BAD="6.2.4"
          picked=""
          for app in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
            swiftbin="$app/Contents/Developer/usr/bin/swift"
            # Guarded, and the failure tolerated: under `set -e` a missing binary here
            # aborts the whole step with 127 and no explanation of which app lacked it.
            [ -x "$swiftbin" ] || { echo "skipping $app (no swift at the expected path)"; continue; }
            v="$("$swiftbin" -version 2>/dev/null | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -n 1 || true)"
            [ -n "$v" ] || { echo "skipping $app (could not read its Swift version)"; continue; }
            echo "candidate $app -> Swift $v"
            case " $BAD " in *" $v "*) echo "skipping $app (Swift $v is known bad)"; continue ;; esac
            picked="$app"; break
          done
          if [ -z "$picked" ]; then
            echo "No installed Xcode has a usable Swift; saw: $(ls -d /Applications/Xcode*.app 2>/dev/null | tr '\n' ' ')" >&2
            exit 1
          fi
          sudo xcode-select -s "$picked"
          xcodebuild -version
          swift --version
          version="$(swift -version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -n 1)"
          case "$version" in
            6.2|6.[3-9]|6.[1-9][0-9]|[7-9].*) echo "toolchain $version is new enough" ;;
            *) echo "This package needs Swift 6.2 or newer; the runner has $version." >&2; exit 1 ;;
          esac

      - name: Build the release binary
        run: swift build -c release --product alohajet ${{ matrix.build_flags }}

      - name: Stage, smoke test and pack
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME:-${{ inputs.version }}}"
          # `--show-bin-path` because a universal build does NOT land in
          # `.build/release`; it lands in `.build/apple/Products/Release`.
          binary="$(swift build -c release --product alohajet ${{ matrix.build_flags }} --show-bin-path)/alohajet"
          # A tarball whose binary cannot start is worse than no release. `--help`
          # touches argument parsing and the usage table and launches no browser.
          "$binary" --help > /dev/null
          stage="dist/alohajet-${version}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "$binary" "$stage/alohajet"
          cp LICENSE README.md SECURITY.md "$stage/" 2>/dev/null || true
          tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "alohajet-${version}-${{ matrix.name }}"
          rm -rf "$stage"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # ONE SHA256SUMS for the whole release, in the format `sha256sum -c` reads, so
      # the install script can verify with a stock tool and no jq.
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
